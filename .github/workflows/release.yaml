name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  extract-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Extract version from tag
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

  build-rpm:
    needs: [extract-version]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - distro: el8
            image: almalinux:8
            releasever: "8"
          - distro: stream9
            image: quay.io/centos/centos:stream9
            releasever: "9"
          - distro: stream10
            image: quay.io/centos/centos:stream10
            releasever: "10"
    container:
      image: ${{ matrix.image }}
    env:
      VERSION: ${{ needs.extract-version.outputs.version }}
    steps:
      - name: Install git
        run: dnf install -y git

      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable CRB/PowerTools repository
        run: |
          dnf install -y 'dnf-command(config-manager)'
          dnf config-manager --set-enabled crb 2>/dev/null \
            || dnf config-manager --set-enabled powertools 2>/dev/null \
            || true

      - name: Install build dependencies
        run: |
          dnf install -y rpm-build rpmdevtools rpm-sign \
            clang llvm bpftool libbpf-devel elfutils-libelf-devel \
            zlib-devel gcc make pkgconfig systemd-rpm-macros

      - name: Setup rpmbuild directory
        run: rpmdev-setuptree

      - name: Create source tarball
        run: |
          cd ..
          tar czf ~/rpmbuild/SOURCES/block-copyfail-${VERSION}.tar.gz \
            --transform "s,^$(basename ${GITHUB_WORKSPACE}),block-copyfail-${VERSION}," \
            "$(basename ${GITHUB_WORKSPACE})"

      - name: Update spec file version
        run: |
          sed -i "s/^Version:.*/Version:        ${VERSION}/" releng/block-copyfail.spec
          cp releng/block-copyfail.spec ~/rpmbuild/SPECS/

      - name: Build RPM
        run: |
          cd ~/rpmbuild/SPECS
          rpmbuild -ba block-copyfail.spec
          echo "=== RPM build macros: rhel=$(rpm --eval '%{?rhel}') fedora=$(rpm --eval '%{?fedora}') ==="

      - name: Sign RPMs
        env:
          RPM_GPG_PRIVATE_KEY: ${{ secrets.RPM_GPG_PRIVATE_KEY }}
        if: ${{ env.RPM_GPG_PRIVATE_KEY != '' }}
        run: |
          mkdir -p ~/.gnupg
          chmod 700 ~/.gnupg
          echo "allow-loopback-pinentry" > ~/.gnupg/gpg-agent.conf
          echo "pinentry-mode loopback" > ~/.gnupg/gpg.conf
          echo "${RPM_GPG_PRIVATE_KEY}" | base64 -d | gpg --batch --import
          GPG_NAME=$(gpg --list-secret-keys --with-colons | awk -F: '/^uid/{print $10; exit}')
          echo "%_signature gpg" > ~/.rpmmacros
          echo "%_gpg_name ${GPG_NAME}" >> ~/.rpmmacros
          rpmsign --addsign ~/rpmbuild/RPMS/x86_64/*.rpm
          rpmsign --addsign ~/rpmbuild/SRPMS/*.src.rpm || true
          gpg --export --armor "${GPG_NAME}" | rpm --import -
          rpm --checksig ~/rpmbuild/RPMS/x86_64/*.rpm

      - name: Copy RPMs to workspace
        run: |
          cp ~/rpmbuild/RPMS/x86_64/*.rpm ${GITHUB_WORKSPACE}/ || true
          cp ~/rpmbuild/SRPMS/*.src.rpm ${GITHUB_WORKSPACE}/ || true

      - name: Upload RPM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rpm-packages-${{ matrix.distro }}
          path: ./*.rpm

  release:
    needs: [build-rpm, extract-version]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.extract-version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all RPM artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: rpm-packages-*

      - name: Generate checksums
        run: |
          cd artifacts
          find . -name '*.rpm' -exec sha256sum {} \; | sed 's|  \./[^/]*/|  |' > ../checksums.sha256
          cat ../checksums.sha256

      - name: Create GitHub release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body: |
            ## block-copyfail ${{ env.VERSION }}

            BPF LSM blocker for CVE-2026-31431 (Copy Fail).

            ### Install
            ```
            sudo dnf config-manager --add-repo https://atgreen.github.io/rhel-block-copyfail/rpm-repo/block-copyfail.repo
            sudo dnf install block-copyfail
            sudo systemctl enable --now block-copyfail
            ```
          artifacts: |
            artifacts/rpm-packages-*/*.rpm
            checksums.sha256
          allowUpdates: true

  build-rpm-repo:
    needs: [release, extract-version]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - distro: el8
            releasever: "8"
          - distro: stream9
            releasever: "9"
          - distro: stream10
            releasever: "10"
    env:
      VERSION: ${{ needs.extract-version.outputs.version }}
      TAG: v${{ needs.extract-version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install createrepo_c
        run: sudo apt-get install -y createrepo-c

      - name: Download RPM assets from release
        run: |
          mkdir -p /tmp/rpms
          gh release download "${TAG}" --pattern "*.el${{ matrix.releasever }}*.rpm" --dir /tmp/rpms --skip-existing
          echo "Downloaded RPMs:"
          ls -lh /tmp/rpms/
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build repodata
        run: createrepo_c /tmp/rpms

      - name: Rewrite package locations to release asset URLs
        run: |
          REPO="${{ github.repository }}"
          BASE="https://github.com/${REPO}/releases/download/${TAG}"

          cd /tmp/rpms/repodata

          gunzip -f *-primary.xml.gz
          PRIMARY=$(ls *-primary.xml)
          sed -i "s|<location href=\"\([^\"]*\.rpm\)\"|<location href=\"${BASE}/\1\"|g" "${PRIMARY}"
          gzip -9 "${PRIMARY}"

          cd /tmp/rpms
          REPODATA=repodata

          cat > "${REPODATA}/repomd.xml" <<'XMLHEADER'
          <?xml version="1.0" encoding="UTF-8"?>
          <repomd xmlns="http://linux.duke.edu/metadata/repo">
          XMLHEADER

          for gz in "${REPODATA}"/*.xml.gz; do
            fname="$(basename "${gz}")"
            type="$(echo "${fname}" | sed 's/.*-\([a-z_]*\)\.xml\.gz/\1/')"
            checksum="$(sha256sum "${gz}" | awk '{print $1}')"
            size="$(stat -c%s "${gz}")"
            open_file="${gz%.gz}"
            gunzip -k -f "${gz}"
            open_checksum="$(sha256sum "${open_file}" | awk '{print $1}')"
            open_size="$(stat -c%s "${open_file}")"
            rm -f "${open_file}"
            cat >> "${REPODATA}/repomd.xml" <<XMLDATA
            <data type="${type}">
              <checksum type="sha256">${checksum}</checksum>
              <open-checksum type="sha256">${open_checksum}</open-checksum>
              <location href="repodata/${fname}"/>
              <size>${size}</size>
              <open-size>${open_size}</open-size>
            </data>
          XMLDATA
          done

          echo "</repomd>" >> "${REPODATA}/repomd.xml"
          sed -i 's/^          //' "${REPODATA}/repomd.xml"

      - name: Sign repomd.xml and export public key
        env:
          RPM_GPG_PRIVATE_KEY: ${{ secrets.RPM_GPG_PRIVATE_KEY }}
        if: ${{ env.RPM_GPG_PRIVATE_KEY != '' }}
        run: |
          echo "${RPM_GPG_PRIVATE_KEY}" | base64 -d | gpg --batch --import
          gpg --batch --detach-sign --armor /tmp/rpms/repodata/repomd.xml
          gpg --batch --export --armor > /tmp/rpms/RPM-GPG-KEY-block-copyfail

      - name: Upload RPM repo artifact
        uses: actions/upload-artifact@v4
        with:
          name: rpm-repo-${{ matrix.releasever }}
          path: /tmp/rpms/repodata/

      - name: Upload RPM GPG key
        if: ${{ hashFiles('/tmp/rpms/RPM-GPG-KEY-block-copyfail') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: rpm-repo-key-${{ matrix.releasever }}
          path: /tmp/rpms/RPM-GPG-KEY-block-copyfail

  deploy-pages:
    needs: [build-rpm-repo, extract-version]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download RPM repo artifacts (EL8)
        uses: actions/download-artifact@v4
        with:
          name: rpm-repo-8
          path: docs/rpm-repo/8/repodata

      - name: Download RPM GPG key (EL8)
        uses: actions/download-artifact@v4
        with:
          name: rpm-repo-key-8
          path: docs/rpm-repo/8
        continue-on-error: true

      - name: Download RPM repo artifacts (EL9)
        uses: actions/download-artifact@v4
        with:
          name: rpm-repo-9
          path: docs/rpm-repo/9/repodata

      - name: Download RPM GPG key (EL9)
        uses: actions/download-artifact@v4
        with:
          name: rpm-repo-key-9
          path: docs/rpm-repo/9
        continue-on-error: true

      - name: Download RPM repo artifacts (EL10)
        uses: actions/download-artifact@v4
        with:
          name: rpm-repo-10
          path: docs/rpm-repo/10/repodata

      - name: Download RPM GPG key (EL10)
        uses: actions/download-artifact@v4
        with:
          name: rpm-repo-key-10
          path: docs/rpm-repo/10
        continue-on-error: true

      - name: Copy shared repo file into each version dir
        run: |
          cp docs/rpm-repo/block-copyfail.repo docs/rpm-repo/8/ || true
          cp docs/rpm-repo/block-copyfail.repo docs/rpm-repo/9/ || true
          cp docs/rpm-repo/block-copyfail.repo docs/rpm-repo/10/ || true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
